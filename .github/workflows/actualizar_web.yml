name: Sincronización Automática de Firebase

on:
  schedule:
    - cron: '*/5 * * * *' # Se ejecuta automáticamente cada 5 minutos en segundo plano
  workflow_dispatch:     # Te deja un botón en GitHub por si quieres forzarlo a mano al instante

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install firebase-admin @vitalets/google-translate-api

      - name: Ejecutar script de sincronización
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: node actualizar_precios_web.js
